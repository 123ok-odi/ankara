<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ankara ⚙️</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#120607;--ring:#7a0a12;--red:#ff2a3a;--hot:#ff5c68;--text:#f5eaea;--mute:#a58a8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:'Chakra Petch',system-ui,sans-serif}
body{display:flex;justify-content:center}
.wrap{width:100%;max-width:460px;padding:20px 18px 40px}
.hide{display:none!important}
h1,h2{font-family:'Bungee',Impact,sans-serif;font-weight:400;margin:0}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;font-size:16px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.red{background:var(--red);color:#000}
.ghost{background:transparent;color:var(--text);border:1.5px solid var(--ring)}
button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
/* gate */
#gate{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.logo{width:170px;height:170px;border-radius:50%;border:2px solid var(--ring);box-shadow:0 0 40px #ff2a3a55,0 0 90px #ff2a3a22;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 56px #ff2a3a88,0 0 110px #ff2a3a33}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
#gate h1{font-size:40px;text-shadow:0 0 18px #ff2a3a99}
.follow{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;margin:8px 0 4px}
.follow svg{width:46px;height:32px;flex:none}
.sub{color:var(--mute);margin:0 0 10px;font-size:15px}
#gate .btns{display:grid;gap:10px;width:100%}
/* app */
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ring)}
header h2{font-size:24px}
label{display:block;color:var(--mute);font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:14px;border-radius:12px;border:1.5px solid var(--ring);background:var(--panel);color:var(--text)}
#sug{display:grid;gap:6px;margin-top:8px}
#sug button{background:var(--panel);color:var(--text);justify-content:space-between;padding:12px 14px;font-weight:500}
#sug small{color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{padding:11px 4px;font-size:14px;background:var(--panel);color:var(--text);border:1.5px solid var(--ring)}
.chip[aria-pressed=true]{background:var(--red);color:#000;border-color:var(--red)}
.sec{margin-top:18px}
#out{margin-top:22px;background:var(--panel);border:1.5px solid var(--ring);border-radius:16px;padding:18px}
#out h2{font-size:20px;margin-bottom:2px}
#out .meta{color:var(--mute);font-size:14px;margin:0 0 14px}
.row{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:10px;margin:10px 0;font-size:15px}
.bar{height:9px;background:#2a0d10;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ring),var(--red));border-radius:9px}
.row b{text-align:right;font-size:17px}
.note{color:var(--mute);font-size:13px;margin:14px 0 0;line-height:1.45}
#out button{margin-top:14px}
</style>
</head>
